<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actualités Régionales</title>
    <!-- Tailwind CSS pour un design propre et responsive -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .loader {
            border-top-color: #3498db;
            -webkit-animation: spinner 1.5s linear infinite;
            animation: spinner 1.5s linear infinite;
        }
        @keyframes spinner {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans">

    <!-- En-tête -->
    <header class="bg-blue-900 text-white p-4 shadow-md sticky top-0 z-10">
        <h1 class="text-xl font-bold text-center">📰 Actualités : Maroc, Golfe & Iran</h1>
        <p class="text-xs text-center text-blue-200 mt-1" id="last-update">Chargement...</p>
        <div class="text-center mt-2">
            <button onclick="fetchNews()" class="bg-blue-700 hover:bg-blue-600 text-white text-xs py-1 px-3 rounded transition">
                🔄 Actualiser maintenant
            </button>
        </div>
    </header>

    <!-- Zone de contenu -->
    <main class="p-4 max-w-2xl mx-auto" id="news-container">
        <div class="flex justify-center items-center h-64">
            <div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-200 h-12 w-12"></div>
        </div>
    </main>

    <script>
        // ⚠️ REMPLACEZ CECI PAR VOTRE VRAIE CLÉ API NEWSDATA.IO
        const API_KEY = "3aee98819a7b4e2d8c426823f1325688"; 
        
        // Pays : ma (Maroc), ae (EAU), sa (Arabie Saoudite), qa (Qatar), kw (Koweït), bh (Bahreïn), om (Oman), ir (Iran)
        // Catégories : politics (politique), business (économie)
        // Langue : 'fr' pour français, ou 'ar' pour arabe (recommandé pour cette région)
        const URL = `https://newsdata.io/api/1/news?apikey=${API_KEY}&country=ma,ae,sa,qa,kw,bh,om,ir&category=politics,business&language=fr`;

        async function fetchNews() {            const container = document.getElementById('news-container');
            const updateText = document.getElementById('last-update');
            
            // Afficher un indicateur de chargement si c'est le premier chargement
            if (container.children.length === 0 || container.innerHTML.includes('loader')) {
                container.innerHTML = `<div class="flex justify-center items-center h-64"><div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-200 h-12 w-12"></div></div>`;
            }

            try {
                const response = await fetch(URL);
                const data = await response.json();

                if (data.status === "success" && data.results.length > 0) {
                    container.innerHTML = ""; // Vider le loader
                    
                    // Mettre à jour l'heure
                    const now = new Date();
                    updateText.innerText = `Dernière mise à jour : ${now.toLocaleTimeString('fr-FR')} (Auto-refresh 30 min)`;

                    // Afficher les articles
                    data.results.forEach(article => {
                        const card = document.createElement('div');
                        card.className = "bg-white rounded-lg shadow-md mb-4 overflow-hidden hover:shadow-lg transition";
                        
                        const imageHtml = article.image_url ? 
                            `<img src="${article.image_url}" alt="News Image" class="w-full h-48 object-cover" onerror="this.style.display='none'">` : '';

                        const date = new Date(article.pubDate).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', hour: '2-digit', minute:'2-digit' });

                        card.innerHTML = `
                            ${imageHtml}
                            <div class="p-4">
                                <span class="text-xs font-semibold text-blue-600 uppercase">${article.source_id || 'Source'}</span>
                                <h2 class="text-lg font-bold mt-1 mb-2 leading-tight">${article.title}</h2>
                                <p class="text-gray-600 text-sm mb-3 line-clamp-3">${article.description || 'Aucune description disponible.'}</p>
                                <div class="flex justify-between items-center text-xs text-gray-500">
                                    <span>📅 ${date}</span>
                                    <a href="${article.link}" target="_blank" class="text-blue-600 hover:underline font-semibold">Lire la suite →</a>
                                </div>
                            </div>
                        `;
                        container.appendChild(card);
                    });
                } else {
                    container.innerHTML = `<p class="text-center text-red-500">Aucune actualité trouvée ou limite API atteinte.</p>`;
                }
            } catch (error) {
                console.error("Erreur:", error);
                container.innerHTML = `<p class="text-center text-red-500">Erreur de connexion. Vérifiez votre clé API ou votre réseau.</p>`;
            }        }

        // Chargement initial
        fetchNews();

        // Rafraîchissement automatique toutes les 30 minutes (30 * 60 * 1000 millisecondes)
        setInterval(fetchNews, 30 * 60 * 1000);
    </script>
</body>
</html>

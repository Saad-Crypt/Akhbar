<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actualités Maroc</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 10px; background: #f5f5f5; }
        .header { background: #1e3a8a; color: white; padding: 20px; text-align: center; border-radius: 10px; margin-bottom: 15px; }
        .article { background: white; padding: 15px; margin: 10px 0; border-radius: 8px; }
        .title { font-size: 16px; font-weight: bold; color: #1e3a8a; margin-bottom: 8px; }
        .source { font-size: 12px; color: #666; }
        .time { font-size: 11px; color: #999; margin-top: 5px; }
        button { background: white; color: #1e3a8a; border: none; padding: 12px 25px; border-radius: 5px; margin: 5px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="header">
        <h1>📰 Actualités Maroc</h1>
        <p id="status">Chargement...</p>
        <button onclick="load()">🔄 Actualiser</button>
    </div>
    <div id="news"></div>

    <script>
        var API_KEY = "pub_b7dbe6602fe348b3b22727e649c18fd9";
        
        function load() {
            var container = document.getElementById('news');
            var status = document.getElementById('status');
            var now = new Date();
            
            container.innerHTML = '<div style="text-align:center;padding:40px;">⏳ Chargement...</div>';
            status.innerHTML = 'Actualisation...';
            
            // URL SANS paramètres personnalisés (sinon erreur 422)
            var url = 'https://newsdata.io/api/1/news?apikey=' + API_KEY + '&country=ma&language=fr';
            
            var xhr = new XMLHttpRequest();
            xhr.open('GET', url, true);
            xhr.setRequestHeader('Cache-Control', 'no-cache');
            xhr.setRequestHeader('Pragma', 'no-cache');
            xhr.setRequestHeader('Expires', '0');
            xhr.timeout = 30000;
            
            xhr.onload = function() {
                if (xhr.status === 200) {
                    try {
                        var data = JSON.parse(xhr.responseText);
                        if (data.status === 'success' && data.results && data.results.length > 0) {
                            status.innerHTML = '✅ ' + data.results.length + ' articles<br><small>MAJ: ' + now.toLocaleTimeString('fr-FR') + '</small>';
                            container.innerHTML = '';
                            
                            for (var i = 0; i < Math.min(data.results.length, 15); i++) {
                                var a = data.results[i];
                                var div = document.createElement('div');
                                div.className = 'article';
                                var pubDate = new Date(a.pubDate);
                                div.innerHTML = '<div class="title">' + a.title + '</div>' +
                                    '<div class="source">📍 ' + (a.source_id || 'Source') + '</div>' +
                                    '<div style="font-size:14px;margin:5px 0;">' + (a.description ? a.description.substring(0, 150) + '...' : '') + '</div>' +
                                    '<div class="time">📅 ' + pubDate.toLocaleString('fr-FR') + '</div>';
                                container.appendChild(div);
                            }
                        } else {
                            container.innerHTML = '<div style="background:#fee;color:#c00;padding:20px;text-align:center;border-radius:8px;">Aucun article</div>';
                        }
                    } catch (e) {
                        container.innerHTML = '<div style="background:#fee;color:#c00;padding:20px;text-align:center;border-radius:8px;">Erreur: ' + e.message + '</div>';
                    }
                } else {
                    container.innerHTML = '<div style="background:#fee;color:#c00;padding:20px;text-align:center;border-radius:8px;">Erreur HTTP: ' + xhr.status + '</div>';
                }
            };
            
            xhr.onerror = function() {
                container.innerHTML = '<div style="background:#fee;color:#c00;padding:20px;text-align:center;border-radius:8px;">Erreur connexion</div>';
            };
            
            xhr.send();
        }
        
        window.onload = function() { setTimeout(load, 500); };
        setInterval(load, 30 * 60 * 1000);
    </script>
</body>
</html>

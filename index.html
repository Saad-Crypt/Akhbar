<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actualités Maroc</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 10px; background: #f5f5f5; }
        .header { background: #1e3a8a; color: white; padding: 20px 15px; text-align: center; border-radius: 10px; margin-bottom: 15px; }
        .header h1 { font-size: 22px; margin-bottom: 10px; }
        .article { background: white; padding: 15px; margin-bottom: 12px; border-radius: 8px; }
        .title { font-size: 16px; font-weight: bold; margin-bottom: 8px; color: #1e3a8a; }
        .source { font-size: 12px; color: #666; margin-bottom: 5px; }
        .error { background: #fee; color: #c00; padding: 20px; border-radius: 8px; text-align: center; margin: 20px 0; }
        button { background: #fff; color: #1e3a8a; border: 2px solid #fff; padding: 12px 25px; border-radius: 5px; margin: 5px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="header">
        <h1>📰 Actualités Maroc</h1>
        <div id="status">Chargement...</div>
        <button onclick="charger()">🔄 Actualiser</button>
    </div>
    <div id="news"></div>

    <script>
        var API_KEY = "pub_b7dbe6602fe348b3b22727e649c18fd9";
        
        function charger() {
            var container = document.getElementById('news');
            var status = document.getElementById('status');
            
            container.innerHTML = '<div style="text-align:center;padding:40px;">Chargement...</div>';
            status.innerHTML = 'Chargement...';
            
            // Utiliser fetch avec les bons paramètres
            fetch('https://newsdata.io/api/1/news?apikey=' + API_KEY + '&country=ma&language=fr')
                .then(function(response) {
                    return response.json();
                })
                .then(function(data) {
                    if (data.status === 'success' && data.results && data.results.length > 0) {
                        var now = new Date();
                        status.innerHTML = '✅ ' + data.results.length + ' articles - ' + now.toLocaleTimeString('fr-FR');
                        container.innerHTML = '';
                        
                        for (var i = 0; i < Math.min(data.results.length, 10); i++) {
                            var article = data.results[i];
                            var div = document.createElement('div');
                            div.className = 'article';
                            div.innerHTML = '<div class="title">' + article.title + '</div>' +
                                '<div class="source">' + (article.source_id || 'Source') + '</div>' +
                                '<div>' + (article.description ? article.description.substring(0, 150) : '') + '...</div>';
                            container.appendChild(div);
                        }
                    } else {
                        container.innerHTML = '<div class="error">Aucun article trouvé</div>';
                        status.innerHTML = 'Erreur';
                    }
                })
                .catch(function(error) {
                    container.innerHTML = '<div class="error">Erreur: ' + error.message + '</div>';
                    status.innerHTML = 'Erreur';
                });
        }
        
        // Chargement auto
        window.onload = function() {
            setTimeout(charger, 500);
        };
        
        // Auto-refresh 30 min
        setInterval(charger, 30 * 60 * 1000);
    </script>
</body>
</html>

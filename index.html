<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actualités</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 10px; background: #f5f5f5; }
        .header { background: #1e3a8a; color: white; padding: 15px; text-align: center; border-radius: 8px; margin-bottom: 15px; }
        .article { background: white; padding: 15px; margin-bottom: 10px; border-radius: 8px; }
        .error { background: #fee; color: #c00; padding: 15px; border-radius: 8px; margin: 10px 0; font-size: 13px; }
        .debug { background: #fff3cd; color: #856404; padding: 10px; border-radius: 5px; margin: 10px 0; font-size: 11px; word-break: break-all; }
        button { background: #1e3a8a; color: white; border: none; padding: 10px 20px; border-radius: 5px; margin: 5px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>📰 Actualités</h1>
        <button onclick="testAPI()">🔍 Tester API</button>
        <button onclick="loadNews()">📰 Charger News</button>
    </div>
    <div id="debug"></div>
    <div id="container"></div>

    <script>
        const API_KEY = "pub_b7dbe6602fe348b3b22727e649c18fd9";
        
        async function testAPI() {
            const debug = document.getElementById('debug');
            const container = document.getElementById('container');
            debug.innerHTML = '<div class="debug">Test en cours...</div>';
            container.innerHTML = '';
            
            try {
                const url = `https://newsdata.io/api/1/news?apikey=${API_KEY}&country=ma&language=fr`;
                
                debug.innerHTML = `
                    <div class="debug">
                        <strong>🔍 DEBUG COMPLET :</strong><br><br>
                        <strong>URL appelée :</strong><br>
                        ${url}<br><br>
                        <strong>Clé API :</strong> ${API_KEY}<br>
                        <strong>Longueur clé :</strong> ${API_KEY.length} caractères<br>
                    </div>
                `;
                
                const response = await fetch(url);
                
                debug.innerHTML += `
                    <div class="debug">                        <strong>Réponse HTTP :</strong><br>
                        Status: ${response.status}<br>
                        StatusText: ${response.statusText}<br>
                        OK: ${response.ok}<br>
                        Type: ${response.type}<br>
                        URL: ${response.url}<br>
                    </div>
                `;
                
                const text = await response.text();
                
                debug.innerHTML += `
                    <div class="debug">
                        <strong>Données brutes (200 premiers caractères) :</strong><br>
                        ${text.substring(0, 200)}...
                    </div>
                `;
                
                try {
                    const data = JSON.parse(text);
                    
                    if (data.status === 'success') {
                        container.innerHTML = `<div style="background:#d4edda;color:#155724;padding:15px;border-radius:8px;">
                            ✅ SUCCÈS !<br>
                            ${data.results.length} articles trouvés
                        </div>`;
                    } else {
                        container.innerHTML = `<div class="error">
                            ❌ Erreur API<br>
                            <strong>Message :</strong> ${data.message || 'Inconnu'}<br>
                            <strong>Status :</strong> ${data.status}
                        </div>`;
                    }
                } catch (e) {
                    container.innerHTML = `<div class="error">❌ Erreur JSON : ${e.message}</div>`;
                }
                
            } catch (error) {
                debug.innerHTML += `
                    <div class="error">
                        <strong>❌ ERREUR DE CONNEXION :</strong><br>
                        ${error.name}<br>
                        ${error.message}<br>
                        <br>
                        <strong>Cause possible :</strong><br>
                        - Problème de connexion internet<br>
                        - Blocage CORS<br>
                        - Clé API invalide
                    </div>
                `;            }
        }
        
        async function loadNews() {
            const container = document.getElementById('container');
            container.innerHTML = '<div style="text-align:center;padding:20px;">Chargement...</div>';
            
            try {
                const url = `https://newsdata.io/api/1/news?apikey=${API_KEY}&country=ma,ae,sa,qa,kw,bh,om,ir&category=politics,business&language=fr`;
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.status === 'success' && data.results.length > 0) {
                    container.innerHTML = '';
                    data.results.slice(0, 5).forEach(article => {
                        const div = document.createElement('div');
                        div.className = 'article';
                        div.innerHTML = `<div style="font-weight:bold;margin-bottom:5px;">${article.title}</div><div style="font-size:12px;color:#666;">${article.source_id}</div>`;
                        container.appendChild(div);
                    });
                } else {
                    container.innerHTML = `<div class="error">Aucun article trouvé</div>`;
                }
            } catch (error) {
                container.innerHTML = `<div class="error">Erreur: ${error.message}</div>`;
            }
        }
        
        // Test automatique au démarrage
        window.onload = function() {
            setTimeout(testAPI, 1000);
        };
    </script>
</body>
</html>

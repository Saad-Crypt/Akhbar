<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actualités</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 10px; background: #f5f5f5; }
        .header { background: #1e3a8a; color: white; padding: 15px; text-align: center; border-radius: 8px; margin-bottom: 15px; }
        .article { background: white; padding: 15px; margin-bottom: 10px; border-radius: 8px; }
        .title { font-size: 16px; font-weight: bold; margin-bottom: 8px; color: #1e3a8a; }
        .error { background: #fee; color: #c00; padding: 15px; border-radius: 8px; text-align: center; margin: 10px 0; }
        button { background: #1e3a8a; color: white; border: none; padding: 10px 20px; border-radius: 5px; margin: 5px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>📰 Actualités</h1>
        <p id="status">Chargement...</p>
        <button onclick="charger()">🔄 Actualiser</button>
    </div>
    <div id="news"></div>

    <script>
        const API_KEY = "pub_b7dbe6602fe348b3b22727e649c18fd9";
        
        async function charger() {
            const news = document.getElementById('news');
            const status = document.getElementById('status');
            
            try {
                // Juste Maroc pour commencer - on ajoutera les autres après
                const url = `https://newsdata.io/api/1/news?apikey=${API_KEY}&country=ma&language=fr`;
                
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.status === 'success' && data.results.length > 0) {
                    status.textContent = `${data.results.length} articles - ${new Date().toLocaleTimeString('fr-FR')}`;
                    news.innerHTML = '';
                    
                    data.results.slice(0, 10).forEach(article => {
                        const div = document.createElement('div');
                        div.className = 'article';
                        div.innerHTML = `
                            <div class="title">${article.title}</div>
                            <div style="font-size:12px;color:#666;">${article.source_id || 'Source inconnue'}</div>
                            <div style="font-size:14px;margin:5px 0;">${article.description ? article.description.substring(0, 150) + '...' : ''}</div>
                        `;
                        news.appendChild(div);
                    });
                } else {
                    news.innerHTML = '<div class="error">Aucun article trouvé</div>';
                }
            } catch (e) {
                news.innerHTML = `<div class="error">Erreur: ${e.message}</div>`;
            }
        }
        
        // Chargement auto au démarrage
        window.onload = () => setTimeout(charger, 1000);
        
        // Auto-refresh 30 min
        setInterval(charger, 30 * 60 * 1000);
    </script>
</body>
</html>

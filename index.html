<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test</title>
</head>
<body style="padding:20px; font-family:Arial;">
    <h1>🔧 TEST APPLICATION</h1>
    
    <div style="background:#e3f2fd; padding:15px; margin:10px 0; border-radius:8px;">
        <h3>✅ Si vous voyez ceci :</h3>
        <p>L'application charge bien le fichier HTML de GitHub</p>
    </div>
    
    <button onclick="tester()" style="padding:15px; font-size:16px; background:#1e3a8a; color:white; border:none; border-radius:5px; margin:10px 0;">
        🧪 Tester l'API
    </button>
    
    <div id="resultat"></div>
    
    <script>
        async function tester() {
            const div = document.getElementById('resultat');
            div.innerHTML = '<p>Test en cours...</p>';
            
            const API_KEY = "pub_b7dbe6602fe348b3b22727e649c18fd9";
            const url = `https://newsdata.io/api/1/news?apikey=${API_KEY}&country=ma&language=fr`;
            
            try {
                const reponse = await fetch(url);
                const data = await reponse.json();
                
                if (data.status === 'success') {
                    div.innerHTML = `
                        <div style="background:#d4edda; padding:15px; border-radius:8px; margin:10px 0;">
                            <h3>✅ SUCCÈS !</h3>
                            <p><strong>Statut:</strong> ${data.status}</p>
                            <p><strong>Articles trouvés:</strong> ${data.results.length}</p>
                            <p><strong>Premier article:</strong></p>
                            <p style="font-size:14px;">${data.results[0].title}</p>
                        </div>
                    `;
                } else {
                    div.innerHTML = `
                        <div style="background:#f8d7da; padding:15px; border-radius:8px;">
                            <h3>❌ Erreur API</h3>
                            <p>${data.message}</p>
                        </div>
                    `;
                }
            } catch (erreur) {
                div.innerHTML = `
                    <div style="background:#f8d7da; padding:15px; border-radius:8px;">
                        <h3>❌ Erreur de connexion</h3>
                        <p>${erreur.message}</p>
                        <p><strong>URL testée:</strong> ${url}</p>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
